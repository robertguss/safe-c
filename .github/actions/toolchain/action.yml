name: Safe C toolchain
description: Install the pinned lint, sanitizer, TLC and proof tools the Gates jobs use.
runs:
  using: composite
  steps:
    - name: Install build and lint tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y opam build-essential clang-18 clang-tidy-18 libclang-rt-18-dev libfuzzer-18-dev pkg-config libgmp-dev libmpfr-dev graphviz zlib1g-dev libmicrohttpd-dev
        python3 -m venv "$RUNNER_TEMP/tools"
        "$RUNNER_TEMP/tools/bin/pip" install semgrep==1.181.0 z3-solver==4.13.3.0
        echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
        mkdir -p "$RUNNER_TEMP/clang18"
        ln -s "$(command -v clang-18)" "$RUNNER_TEMP/clang18/clang"
        ln -s "$(command -v clang-tidy-18)" "$RUNNER_TEMP/clang18/clang-tidy"
        echo "$RUNNER_TEMP/clang18" >> "$GITHUB_PATH"
        mkdir -p build
    - name: Install explorer dependencies (libpq, libpq 18, SDL3)
      shell: bash
      run: |
        sudo apt-get install -y cmake libpq-dev libfreetype-dev libharfbuzz-dev \
          libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxtst-dev \
          libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libdrm-dev libgbm-dev \
          bison flex libssl-dev
        sh scripts/install-sdl3.sh build/tools/sdl3
        sh scripts/install-libpq.sh build/tools/libpq18
    - name: Install TLC
      shell: bash
      run: |
        mkdir -p build/tools
        curl -fsSL -o build/tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
        echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  build/tools/tla2tools.jar" | sha256sum -c -
        java -version
    - uses: actions/cache/restore@v4
      id: opam-cache
      with:
        path: ~/.opam
        key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.1-fc33-ae2.6.4-z3.4.13.3-v1
    - name: Install pinned proof tools
      env:
        CACHE_HIT: ${{ steps.opam-cache.outputs.cache-hit }}
      shell: bash
      run: |
        started=$SECONDS
        opam init --bare --disable-sandboxing -y
        if ! opam switch list --short | grep -qx safec; then
          opam switch create safec ocaml-base-compiler.5.2.1 -y
        fi
        eval "$(opam env --switch=safec)"
        opam install -y frama-c.33.0 alt-ergo.2.6.4 why3.1.8.2
        why3 config detect
        echo "cache_hit=${CACHE_HIT:-false} install_seconds=$((SECONDS-started))" | tee build/ci-times.txt
        echo "$(opam var bin)" >> "$GITHUB_PATH"
        ocamlc -version
        frama-c -version
        alt-ergo --version
        z3 --version
        clang-18 --version
        semgrep --version
    - name: Save installed proof tools
      if: steps.opam-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.opam
        key: ${{ steps.opam-cache.outputs.cache-primary-key }}
