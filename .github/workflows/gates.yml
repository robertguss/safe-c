name: Gates

# Runs only when started by hand (Actions > Gates > Run workflow); nothing runs on
# push, pull request or a schedule. `make ci` runs the same checks locally.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      fuzz_seconds:
        type: string
        default: '5'

permissions:
  contents: read

# A new push to a PR supersedes the run on its old head.
concurrency:
  group: gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPAMJOBS: '2'
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/formal-tools
      - name: Run gates and fixture suites
        # make mutate runs split across the mutate jobs below.
        run: python3 scripts/ci.py --skip mutate
      - name: Proof table in job summary
        if: always()
        run: |
          if [ -f build/prove-table.txt ]; then
            cat build/prove-table.txt
            { echo '### make prove'; echo '```'; cat build/prove-table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/prove.log
            build/prove-table.txt
            build/prove-summary.json
            build/prove-selftest.log
            build/gates.log
            build/ci/*.log
            build/ci-times.txt
            build/sc05/*.log
            build/sc06/*.log
            build/sc07/*.log
            build/sc09/*.log
            build/sc23/*.log
            build/model/*.log
            build/model/mutants/*.log
            build/genmc/**/*.log
            build/tlaps/**/*.log
          if-no-files-found: warn
  mutate:
    name: mutate (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      OPAMJOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/toolchain
      - name: Run make mutate, shard ${{ matrix.shard }} of 6
        shell: bash
        run: |
          set -o pipefail
          make mutate MUTATE_SHARD=${{ matrix.shard }}/6 2>&1 | tee build/mutate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutate-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mutate.log
          if-no-files-found: warn
  # The one check to require: green only when every gate and every mutate shard is.
  gates:
    runs-on: ubuntu-24.04
    needs: [checks, mutate]
    if: always()
    steps:
      - name: Require checks and every mutate shard
        env:
          CHECKS: ${{ needs.checks.result }}
          MUTATE: ${{ needs.mutate.result }}
        run: |
          echo "checks: $CHECKS, mutate: $MUTATE"
          test "$CHECKS" = success && test "$MUTATE" = success
  advisory:
    name: Advisory (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        tool: [valgrind, csa]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: sudo apt-get update -qq && sudo apt-get install -y clang-18 valgrind
      - name: Analyze available sources
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          status = 0
          if os.environ['TOOL'] == 'csa':
              sources = sorted(Path('stdlib').glob('*.c'))
              for src in sources:
                  result = subprocess.run(['clang-18', '--analyze', '-Iinclude', str(src)])
                  status |= result.returncode
          else:
              sources = [s for s in sorted(Path('tests').rglob('*_test.c'))
                         if s.relative_to('tests').parts[0] not in {'lint', 'gates'}]
              Path('build/advisory').mkdir(parents=True, exist_ok=True)
              for i, src in enumerate(sources):
                  out = f'build/advisory/test-{i}'
                  result = subprocess.run(['clang-18', '-std=c11', '-g', '-Iinclude', str(src), *map(str, sorted(Path('stdlib').glob('*.c'))), '-o', out])
                  status |= result.returncode
                  if result.returncode == 0:
                      status |= subprocess.run(['valgrind', '--fair-sched=yes', '--error-exitcode=1', '--leak-check=full', out]).returncode
          print(f'{os.environ["TOOL"]}: {len(sources)} sources')
          sys.exit(status)
          PY
