name: Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      fuzz_seconds:
        type: string
        default: '5'

permissions:
  contents: read

# A new push to a PR supersedes the run on its old head.
concurrency:
  group: gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPAMJOBS: '2'
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/formal-tools
      - name: Run gates and fixture suites
        # make mutate runs split across the mutate jobs below.
        run: python3 scripts/ci.py --skip mutate
      - name: Proof table in job summary
        if: always()
        run: |
          if [ -f build/prove-table.txt ]; then
            cat build/prove-table.txt
            { echo '### make prove'; echo '```'; cat build/prove-table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/prove.log
            build/prove-table.txt
            build/prove-summary.json
            build/prove-selftest.log
            build/gates.log
            build/ci/*.log
            build/ci-times.txt
            build/sc05/*.log
            build/sc06/*.log
            build/sc07/*.log
            build/sc09/*.log
            build/model/*.log
            build/model/mutants/*.log
            build/genmc/**/*.log
            build/tlaps/**/*.log
          if-no-files-found: warn
  mutate:
    name: mutate (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      OPAMJOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/toolchain
      - name: Run make mutate, shard ${{ matrix.shard }} of 6
        shell: bash
        run: |
          set -o pipefail
          make mutate MUTATE_SHARD=${{ matrix.shard }}/6 2>&1 | tee build/mutate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutate-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mutate.log
          if-no-files-found: warn
  # qgate's push stage: function length, file length and duplication against
  # qgate.baseline, plus every tool in qgate.toml. It catches changes that reach
  # main without the local hooks having run, so the baseline cannot drift.
  qgate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # qgate diffs HEAD against its merge base with the base ref.
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
        with:
          proof-tools: 'false'
      - name: Install qgate at the version qgate.toml pins
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("qgate.toml", "rb"))["qgate_version"])')
          curl -fsSL "https://github.com/robertguss/qgate/releases/download/v$version/install.sh" \
            | QGATE_VERSION="v$version" QGATE_INSTALL_DIR="$RUNNER_TEMP/qgate" sh
          echo "$RUNNER_TEMP/qgate" >> "$GITHUB_PATH"
      - name: qgate run --stage push
        env:
          # A PR is checked against its base branch, a push against the commit it replaced.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: qgate run --stage push --base "$BASE" --format github
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qgate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .git/qgate/logs/
          if-no-files-found: warn
  # The one check to require: green only when every gate, every mutate shard and
  # qgate are (qgate is skipped on scheduled and manual runs).
  gates:
    runs-on: ubuntu-24.04
    needs: [checks, mutate, qgate]
    if: always()
    steps:
      - name: Require checks, every mutate shard and qgate
        env:
          CHECKS: ${{ needs.checks.result }}
          MUTATE: ${{ needs.mutate.result }}
          QGATE: ${{ needs.qgate.result }}
        run: |
          echo "checks: $CHECKS, mutate: $MUTATE, qgate: $QGATE"
          test "$CHECKS" = success && test "$MUTATE" = success
          case "$QGATE" in success | skipped) ;; *) exit 1 ;; esac
  advisory:
    name: Advisory (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        tool: [valgrind, csa]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: sudo apt-get update -qq && sudo apt-get install -y clang-18 valgrind
      - name: Analyze available sources
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          status = 0
          if os.environ['TOOL'] == 'csa':
              sources = sorted(Path('stdlib').glob('*.c'))
              for src in sources:
                  result = subprocess.run(['clang-18', '--analyze', '-Iinclude', str(src)])
                  status |= result.returncode
          else:
              sources = [s for s in sorted(Path('tests').rglob('*_test.c'))
                         if s.relative_to('tests').parts[0] not in {'lint', 'gates'}]
              Path('build/advisory').mkdir(parents=True, exist_ok=True)
              for i, src in enumerate(sources):
                  out = f'build/advisory/test-{i}'
                  result = subprocess.run(['clang-18', '-std=c11', '-g', '-Iinclude', str(src), *map(str, sorted(Path('stdlib').glob('*.c'))), '-o', out])
                  status |= result.returncode
                  if result.returncode == 0:
                      status |= subprocess.run(['valgrind', '--fair-sched=yes', '--error-exitcode=1', '--leak-check=full', out]).returncode
          print(f'{os.environ["TOOL"]}: {len(sources)} sources')
          sys.exit(status)
          PY
