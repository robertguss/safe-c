# Surviving mutants that change no observable behavior, so no contract can reject them.
# Each entry names the mutant as `make mutate` prints it (file, line, kind) and says why
# it is equivalent. A line shift in the source invalidates the entry; the mutant then
# fails the gate until the entry is updated. A survivor that is not behavior-preserving is a weak contract: fix the contract.
#

[[equivalent]]
file = "stdlib/arena.c"
line = "17"
kind = "cmp >->>= #2"
reason = "n == SIZE_MAX - 7 is rejected either way: its rounded size exceeds cap - used (cap <= PTRDIFF_MAX)"

[[equivalent]]
file = "stdlib/arena.c"
line = "17"
kind = "arith - #1"
reason = "Redundant guard: valid_arena bounds cap by PTRDIFF_MAX, so the remaining checks on this line and the rounded check at line 20 reject the same sizes"

[[equivalent]]
