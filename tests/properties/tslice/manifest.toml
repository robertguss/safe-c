[[property]]
id = "alloc-creates-element-storage"
function = "sc_tslice_alloc"
statement = "A nonzero allocation that fits creates a current slice containing exactly count elements of the requested size and preserves arena validity."
client = "prop_alloc_creates_element_storage"
author = "openai-codex:gpt-6-astra"

[[property]]
id = "alloc-overflow-preserves-arena"
function = "sc_tslice_alloc"
statement = "An overflowing element-count product produces no element storage and leaves the arena unchanged."
client = "prop_alloc_overflow_preserves_arena"
author = "openai-codex:gpt-6-astra"

[[property]]
id = "len-counts-elements"
function = "sc_tslice_len"
statement = "For a slice with a positive element size and a whole number of elements, length is the byte length divided by the element size."
client = "prop_len_counts_elements"
author = "openai-codex:gpt-6-astra"

[[property]]
id = "get-checks-and-copies"
function = "sc_tslice_get"
statement = "Reading an allocated slice succeeds exactly when its epoch is current, its element size matches, and its index is in range; success copies the complete element, and failure preserves the output."
client = "prop_get_checks_and_copies"
author = "openai-codex:gpt-6-astra"

[[property]]
id = "set-checks-copies-and-preserves"
function = "sc_tslice_set"
statement = "Writing an allocated slice succeeds exactly when its epoch is current, its element size matches, and its index is in range; success replaces only that element, and failure preserves all slice bytes."
client = "prop_set_checks_copies_and_preserves"
author = "openai-codex:gpt-6-astra"

[[dispute]]
property = "alloc-creates-element-storage"
objection = "WP times out on the second ensures clause of prop_alloc_creates_element_storage (`\\result.bytes.len == count * elem`), even with a 60 second limit. The provers handle nonlinear arithmetic poorly: preconditions that bound only the product `count * elem` do not let them derive the overflow facts a caller of an allocation by count and element size usually needs. The property may be right; the client's preconditions are hard for the provers to use as written.\n"
decision = "rewrite"
reason = "The allocation guarantee follows from the brief; a prover timeout does not justify removing it. Add an equivalent division-based overflow bound to expose the needed arithmetic fact without restricting the original input domain or weakening the guarantees."
author = "openai-codex:gpt-6-astra"
date = "2026-10-22"

[[dispute]]
property = "alloc-overflow-preserves-arena"
objection = "The `assigns \\nothing` frame of prop_alloc_overflow_preserves_arena fails. An assigns clause lists what a call may write, not what it ends up changing: an allocation may write the arena's cursor, and the client's own `ensures a->used == \\old(a->used)` already states that a refused allocation leaves the arena as it was. The frame claims more than a caller can rely on. The ensures clauses prove.\n"
decision = "rewrite"
reason = "The brief supports overflow rejection and preservation of arena state, but does not forbid writing the cursor back to its original value. Allow writes to a->used while retaining its equality postcondition; the frame preserves all other state."
author = "openai-codex:gpt-6-astra"
date = "2026-10-22"

[[dispute]]
property = "get-checks-and-copies"
objection = "WP cannot prove the second ensures clause of prop_get_checks_and_copies (verdict failed, also with a 60 second limit). It indexes the source bytes by `i * s.elem`, while the request is made with the `elem` argument. The two are equal only when the call succeeds, and the provers do not make that substitution inside a nonlinear index. The other clauses prove.\n"
decision = "rewrite"
reason = "The complete-element copy guarantee follows from the brief and should remain. Express its source offset as i * elem: success already guarantees elem == s.elem, so this is equivalent without requiring substitution inside the nonlinear index."
author = "openai-codex:gpt-6-astra"
date = "2026-10-22"
