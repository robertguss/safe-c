[[dispute]]
property = "from-lit-content"
objection = "Frama-C rejects props.c before proving anything: `tests/properties/str/props.c:4: unexpected token 'const'`. ACSL predicate parameters cannot carry the C `const` qualifier, so every property in this module is blocked until the file parses. This objection names from-lit-content only because a dispute names one property; the problem is the shared predicates.\n"
decision = "rewrite"
reason = "The objection identifies a syntax defect in the shared ACSL predicates, not a defect in the construction guarantee. Remove const qualifiers from predicate parameters while preserving the properties and C function signatures."
author = "openai-codex:gpt-6-astra"
date = "2026-10-22"
