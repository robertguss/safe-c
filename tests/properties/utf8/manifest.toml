[[property]]
id = "prev-selects-nearest-boundary"
function = "sc_utf8_prev"
statement = "For a live string and an offset from one through its length, previous selects the largest boundary among the preceding four offsets, falling back to the preceding byte; zero, past-end and stale inputs return zero."
client = "prop_prev_selects_nearest_boundary"
author = "openai-codex:gpt-6-astra"

[[property]]
id = "truncate-selects-valid-prefix"
function = "sc_utf8_truncate"
statement = "Truncation preserves a live string when the limit reaches its length; otherwise it selects the largest boundary within three bytes below the limit, falling back to the limit. The prefix shares pointer and epoch and preserves UTF-8 validity when the input is valid. Stale input returns a null pointer and zero length, with epoch unspecified."
client = "prop_truncate_selects_valid_prefix"
author = "openai-codex:gpt-6-astra"

[[dispute]]
property = "truncate-selects-valid-prefix"
objection = "The property requires a stale input to give a result with epoch 0. The brief asks for \"the canonical empty string\", and in this library the canonical empty string carries the arena's current epoch: `sc_slice_sub`, `sc_str_from_lit` and `sc_arena_alloc` all return `{NULL, 0, a->epoch}`, so that an empty result is live in its arena. An empty string with epoch 0 is stale in any arena that has been reset once, so a caller that compares the result with another live empty string (`sc_str_eq`) would get false. The stale case should require `\\result.epoch == a->epoch`, or leave the epoch unconstrained, not `\\result.epoch == 0`. The rest of the property is not in dispute.\n"
decision = "rewrite"
reason = "The brief does not specify the epoch of the canonical empty string, so requiring epoch zero is unsupported. Leave the stale result's epoch unconstrained; the objection's claims about other implementations do not establish a current-epoch requirement from this brief."
author = "openai-codex:gpt-6-astra"
date = "2026-10-26"
