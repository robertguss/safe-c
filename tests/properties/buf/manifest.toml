[[dispute]]
property = "view-written-bytes"
objection = "The property requires the empty result to carry epoch 0. The brief asks for \"the canonical empty string\", and in this library the canonical empty string carries the arena's current epoch: `sc_slice_sub`, `sc_str_from_lit` and `sc_arena_alloc` all return `{NULL, 0, a->epoch}` (the `epoch` field of the result equals the arena's epoch), so that an empty result is live in its arena. An empty string with epoch 0 is stale in any arena that has been reset once, so a caller that compares the view with another live empty string (`sc_str_eq`) would get false, and `sc_str_eq` documents that a stale string equals nothing. The empty case should require `\\result.epoch == a->epoch`, not `\\result.epoch == 0`.\n"
decision = "rewrite"
reason = "The brief does not define the epoch of the canonical empty string, so neither epoch 0 nor the arena's current epoch is justified by the supplied specification. Keep the empty-result and written-prefix guarantees, but remove the empty-result epoch constraint; the objection's claims about other functions are not established by their supplied declarations."
author = "openai-codex:gpt-6-astra"
date = "2026-10-26"
