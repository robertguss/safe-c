# qgate: the local quality gate (https://github.com/robertguss/qgate).
# Loosening anything here fails the next run until Robert runs `qgate approve`.
qgate_version = "0.2.0"

# Research notes and recorded evidence logs are not code.
exclude = ["research-wiki/**", "docs/evidence/**"]

# Markers that switch a check off, on top of qgate's built-in table (which has
# NOLINT): a sanitizer opt-out, and ACSL clauses WP takes as given instead of
# proving. Adding one needs approval, in stdlib/ too, where lint does not run.
ignore_patterns = [
    "no_sanitize",
    "admit requires",
    "admit ensures",
    "admit invariant",
    "admit lemma",
    "@ admit",
    "axiom",
]

[limits]
function_lines = 50
file_lines = 500

[duplication]
enabled = true
min_tokens = 50

# Subset v1 lint (semgrep, clang-tidy, compiler warnings), the same scan as
# `make lint`. It runs over the whole tree whenever a C file is staged, because
# lint.py only skips stdlib/, tests/, fuzz/ and the rest when it picks the files.
[[tool]]
name = "lint"
command = "python3 scripts/lint.py"
globs = ["**/*.c", "**/*.h"]
stage = "commit"
timeout_secs = 120
# scripts/tools.py holds CLANG_FLAGS, the warnings behind R7 and R11.
config_files = ["lint/semgrep/subset-v1.yml", ".clang-tidy", "scripts/tools.py"]
format = "text"

# Waiver expiry and format check. Both files it guards excuse a gap in the
# evidence: waivers.toml an unproved WP goal, mutate-equivalent.toml a mutant WP
# did not reject, so a new entry in either needs approval.
[[tool]]
name = "waivers"
command = "python3 scripts/waivers-report.py"
globs = ["waivers.toml"]
stage = "commit"
timeout_secs = 60
config_files = ["waivers.toml", "tests/mutate-equivalent.toml"]
format = "text"

# Unit tests under ASan and UBSan.
[[tool]]
name = "test"
command = "python3 scripts/sanitize.py test"
stage = "push"
timeout_secs = 600
format = "text"

# Tests that include <pthread.h>, under ThreadSanitizer.
[[tool]]
name = "tsan"
command = "python3 scripts/sanitize.py tsan"
stage = "push"
timeout_secs = 600
format = "text"
