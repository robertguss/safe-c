rules:
  - id: R1-no-subscript
    languages: [c]
    severity: ERROR
    message: R1-no-subscript raw subscript
    pattern: "$P[$I]"
  - id: R2-no-ptr-arith
    languages: [c]
    severity: ERROR
    message: R2-no-ptr-arith pointer arithmetic
    pattern-either:
      - patterns:
          - pattern: $P + $N
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: $N + $P
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: $P - $N
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: $N - $P
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: $P += $N
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: $P -= $N
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: $P++
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: ++$P
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: $P--
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - patterns:
          - pattern: --$P
          - metavariable-type:
              metavariable: $P
              type: $T *
          - metavariable-regex:
              metavariable: $P
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
      - pattern: "*($P + $N)"
      - pattern: "*($P - $N)"
  - id: R4-no-varargs
    languages: [c]
    severity: ERROR
    message: R4-no-varargs varargs
    pattern-either:
      - pattern: va_start(...)
      - pattern: va_arg(...)
  - id: R5-no-malloc-free
    languages: [c]
    severity: ERROR
    message: R5-no-malloc-free raw heap
    pattern-either:
      - pattern: malloc(...)
      - pattern: calloc(...)
      - pattern: realloc(...)
      - pattern: free(...)
  - id: R6-no-raw-array
    languages: [c]
    severity: ERROR
    message: R6-no-raw-array raw array
    pattern-either:
      - pattern: "$T $A[$N];"
      - pattern: "$T $A[$N] = $I;"
      - pattern: "$T $A[];"
      - pattern: "$T $A[] = $I;"
      - pattern: "typedef $T $A[$N];"
  - id: R8-no-goto
    languages: [c]
    severity: ERROR
    message: R8-no-goto goto
    pattern: goto $L;
  - id: R9-no-errno
    languages: [c]
    severity: ERROR
    message: R9-no-errno use Result not errno
    pattern: errno
  - id: R12-no-alloca
    languages: [c]
    severity: ERROR
    message: R12-no-alloca alloca
    pattern-either:
      - pattern: alloca(...)
      - pattern: __builtin_alloca(...)
  - id: R13-unchecked-result
    languages: [c]
    severity: ERROR
    message: R13-unchecked-result read .value only after a tag check
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $R.value
              - pattern: $R->value
          - pattern-not-inside: |
              if ($R.ok) { ... }
          - pattern-not-inside: |
              if ($R.ok && ...) { ... }
          - pattern-not-inside: |
              if (!$R.ok) { ... } else { ... }
          - pattern-not-inside: |
              $R.ok ? ... : ...
          - pattern-not-inside: |
              $R.ok && ...
          - pattern-not-inside: |
              !$R.ok || ...
          - pattern-not-inside:
              patterns:
                - pattern: |
                    if (!$R.ok) { return $X; }
                    ...
                - metavariable-regex:
                    metavariable: $X
                    regex: '^(?!.*\bvalue\b)'
          - pattern-not-inside: |
              if ($R->ok) { ... }
          - pattern-not-inside: |
              if ($R->ok && ...) { ... }
          - pattern-not-inside: |
              if (!$R->ok) { ... } else { ... }
          - pattern-not-inside: |
              $R->ok ? ... : ...
          - pattern-not-inside: |
              $R->ok && ...
          - pattern-not-inside: |
              !$R->ok || ...
          - pattern-not-inside:
              patterns:
                - pattern: |
                    if (!$R->ok) { return $X; }
                    ...
                - metavariable-regex:
                    metavariable: $X
                    regex: '^(?!.*\bvalue\b)'
          - pattern-not-inside: |
              if ($R.some) { ... }
          - pattern-not-inside: |
              if ($R.some && ...) { ... }
          - pattern-not-inside: |
              if (!$R.some) { ... } else { ... }
          - pattern-not-inside: |
              $R.some ? ... : ...
          - pattern-not-inside: |
              $R.some && ...
          - pattern-not-inside: |
              !$R.some || ...
          - pattern-not-inside:
              patterns:
                - pattern: |
                    if (!$R.some) { return $X; }
                    ...
                - metavariable-regex:
                    metavariable: $X
                    regex: '^(?!.*\bvalue\b)'
          - pattern-not-inside: |
              if ($R->some) { ... }
          - pattern-not-inside: |
              if ($R->some && ...) { ... }
          - pattern-not-inside: |
              if (!$R->some) { ... } else { ... }
          - pattern-not-inside: |
              $R->some ? ... : ...
          - pattern-not-inside: |
              $R->some && ...
          - pattern-not-inside: |
              !$R->some || ...
          - pattern-not-inside:
              patterns:
                - pattern: |
                    if (!$R->some) { return $X; }
                    ...
                - metavariable-regex:
                    metavariable: $X
                    regex: '^(?!.*\bvalue\b)'
      - pattern: |
          if (!$R.ok) { ... <... $R.value ...>; ... }
      - pattern: |
          if ($R.ok) { ... } else { ... <... $R.value ...>; ... }
      - pattern: |
          if (!$R.ok) { ... <... $R->value ...>; ... }
      - pattern: |
          if ($R.ok) { ... } else { ... <... $R->value ...>; ... }
      - pattern: |
          if (!$R->ok) { ... <... $R.value ...>; ... }
      - pattern: |
          if ($R->ok) { ... } else { ... <... $R.value ...>; ... }
      - pattern: |
          if (!$R->ok) { ... <... $R->value ...>; ... }
      - pattern: |
          if ($R->ok) { ... } else { ... <... $R->value ...>; ... }
      - pattern: |
          if (!$R.some) { ... <... $R.value ...>; ... }
      - pattern: |
          if ($R.some) { ... } else { ... <... $R.value ...>; ... }
      - pattern: |
          if (!$R.some) { ... <... $R->value ...>; ... }
      - pattern: |
          if ($R.some) { ... } else { ... <... $R->value ...>; ... }
      - pattern: |
          if (!$R->some) { ... <... $R.value ...>; ... }
      - pattern: |
          if ($R->some) { ... } else { ... <... $R.value ...>; ... }
      - pattern: |
          if (!$R->some) { ... <... $R->value ...>; ... }
      - pattern: |
          if ($R->some) { ... } else { ... <... $R->value ...>; ... }
