rules:
  - id: R1-no-subscript
    languages: [c]
    severity: ERROR
    message: R1 bans array subscripts.
    paths:
      exclude: [stdlib/, adapters/]
    pattern: $A[$I]
  - id: R2-no-pointer-arithmetic
    languages: [c]
    severity: ERROR
    message: R2 bans pointer arithmetic.
    paths:
      exclude: [stdlib/, adapters/]
    pattern-either:
      - pattern: "*($P + $N)"
      - pattern: "*($P - $N)"
  - id: R3-no-char-star
    languages: [c]
    severity: ERROR
    message: R3 bans char star.
    paths:
      exclude: [stdlib/, adapters/]
    pattern-regex: 'char\s*\*'
  - id: R4-no-varargs
    languages: [c]
    severity: ERROR
    message: R4 bans variadic functions.
    paths:
      exclude: [stdlib/, adapters/]
    pattern-either:
      - pattern: va_start($L, $X)
      - pattern-regex: '\.\.\.'
  - id: R5-no-malloc
    languages: [c]
    severity: ERROR
    message: R5 bans malloc, calloc, realloc, and free.
    paths:
      exclude: [stdlib/, adapters/]
    pattern-regex: '\b(malloc|calloc|realloc|free)\s*\('
  - id: R6-no-unchecked-libc
    languages: [c]
    severity: ERROR
    message: R6 bans unchecked libc string and scan calls.
    paths:
      exclude: [stdlib/, adapters/]
    pattern-regex: '\b(strcpy|strcat|sprintf|gets|scanf)\s*\('
  - id: R8-no-goto
    languages: [c]
    severity: ERROR
    message: R8 bans goto.
    paths:
      exclude: [stdlib/, adapters/]
    pattern: goto $L;
  - id: R9-no-setjmp
    languages: [c]
    severity: ERROR
    message: R9 bans setjmp and longjmp.
    paths:
      exclude: [stdlib/, adapters/]
    pattern-either:
      - pattern: setjmp($B)
      - pattern: longjmp($B, $V)
  - id: R12-no-alloca
    languages: [c]
    severity: ERROR
    message: R12 bans alloca.
    paths:
      exclude: [stdlib/, adapters/]
    pattern: alloca($N)
