rules:
  - id: R1-no-subscript
    languages: [c]
    severity: ERROR
    message: raw subscript
    paths:
      exclude: [stdlib/, adapters/]
    pattern: "$P[$I]"
  - id: R2-no-ptr-arith
    languages: [c]
    severity: ERROR
    message: pointer arithmetic
    paths:
      exclude: [stdlib/, adapters/]
    pattern-either:
      - pattern: "*($P + $N)"
      - pattern: "*($P - $N)"
      - pattern: "$P++"
  - id: R3-no-char-ptr
    languages: [c]
    severity: ERROR
    message: char* outside stdlib
    paths:
      exclude: [stdlib/, adapters/]
    pattern-regex: '\bchar\s*\*'
  - id: R4-no-varargs
    languages: [c]
    severity: ERROR
    message: varargs
    paths:
      exclude: [stdlib/, adapters/]
    pattern-either:
      - pattern: va_start(...)
      - pattern: va_arg(...)
  - id: R5-no-malloc-free
    languages: [c]
    severity: ERROR
    message: raw heap
    paths:
      exclude: [stdlib/, adapters/]
    pattern-either:
      - pattern: malloc(...)
      - pattern: calloc(...)
      - pattern: realloc(...)
      - pattern: free(...)
      - pattern-regex: '\b(malloc|calloc|realloc|free)\s*\('
  - id: R6-no-raw-array
    languages: [c]
    severity: ERROR
    message: raw array
    paths:
      exclude: [stdlib/, adapters/]
    pattern-either:
      - pattern: "$T $A[$N];"
      - pattern: "$T $A[$N] = $I;"
      - pattern: "$T $A[];"
  - id: R8-no-goto
    languages: [c]
    severity: ERROR
    message: goto
    paths:
      exclude: [stdlib/, adapters/]
    pattern: goto $L;
  - id: R9-no-errno
    languages: [c]
    severity: ERROR
    message: use Result not errno
    paths:
      exclude: [stdlib/, adapters/]
    pattern: errno
  - id: R12-no-alloca
    languages: [c]
    severity: ERROR
    message: alloca
    paths:
      exclude: [stdlib/, adapters/]
    pattern-either:
      - pattern: alloca(...)
      - pattern: __builtin_alloca(...)
