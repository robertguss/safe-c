\* scripts/model.py runs this file once per sender count in MODEL_SENDERS and
\* queue size in MODEL_QUEUE_SIZES, replacing the Senders and QueueSize lines.
CONSTANTS
    Senders = {s1, s2}
    QueueSize = 1
    Msgs = {m1, m2, m3, m4}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoDoubleOwner
    NoUseAfterSend
    OwnedWhileLive
    NothingAfterClose
    FifoOrder
    NoEarlyRecv
    NoLostMessage

PROPERTIES
    Drains
